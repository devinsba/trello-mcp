name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2 # no floating major tags for this action
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2 # no floating major tags for this action
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  image:
    # Release builds the real images itself
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: buildpacks/github-actions/setup-pack@v6.2.1
        with:
          pack-version: 0.40.10
      - run: pack build ci-image --builder paketobuildpacks/builder-jammy-buildpackless-tiny --buildpack docker://paketobuildpacks/python
