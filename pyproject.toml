[project]
name = "trello-mcp"
version = "0.1.0"
description = "Trello MCP server and CLI with an OAuth flow for credentials"
authors = [
    { name = "Brian Devins", email = "badevins@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "mcp>=2",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-requests>=0.66b2",
    "opentelemetry-instrumentation-system-metrics>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "requests>=2.34.2",
    "structlog>=26.1.0",
    "uvicorn>=0.30",
]

[project.scripts]
trello-mcp = "trello_mcp:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
